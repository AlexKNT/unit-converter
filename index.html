<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <style>
        :root {
            --primary-bg: #f8f9fa;
            --card-bg: #ffffff;
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --text-color: #2d3436;
            --border-color: #dfe6e9;
            --success-color: #55efc4;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .conversion-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
        }

        .unit-selectors {
            display: flex;
            gap: 1rem;
        }

        .unit-selectors > div {
            flex: 1;
        }

        .convert-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .convert-btn:hover {
            background-color: var(--secondary-color);
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: var(--success-color);
            border-radius: var(--border-radius);
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .tab-container {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
            margin-right: 0.5rem;
        }

        .tab.active {
            background-color: var(--secondary-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 600px) {
            .unit-selectors {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Unit Converter</h1>
        
        <div class="tab-container">
            <div class="tab active" data-tab="length">Length</div>
            <div class="tab" data-tab="weight">Weight</div>
            <div class="tab" data-tab="temperature">Temperature</div>
        </div>
        
        <!-- Length Conversion -->
        <div id="length" class="tab-content conversion-card active">
            <div class="form-group">
                <label for="length-value">Value:</label>
                <input type="number" id="length-value" placeholder="Enter value" step="any">
            </div>
            
            <div class="unit-selectors">
                <div class="form-group">
                    <label for="length-from">From:</label>
                    <select id="length-from">
                        <option value="millimeter">Millimeter (mm)</option>
                        <option value="centimeter">Centimeter (cm)</option>
                        <option value="meter" selected>Meter (m)</option>
                        <option value="kilometer">Kilometer (km)</option>
                        <option value="inch">Inch (in)</option>
                        <option value="foot">Foot (ft)</option>
                        <option value="yard">Yard (yd)</option>
                        <option value="mile">Mile (mi)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="length-to">To:</label>
                    <select id="length-to">
                        <option value="millimeter">Millimeter (mm)</option>
                        <option value="centimeter">Centimeter (cm)</option>
                        <option value="meter">Meter (m)</option>
                        <option value="kilometer">Kilometer (km)</option>
                        <option value="inch" selected>Inch (in)</option>
                        <option value="foot">Foot (ft)</option>
                        <option value="yard">Yard (yd)</option>
                        <option value="mile">Mile (mi)</option>
                    </select>
                </div>
            </div>
            
            <button class="convert-btn" id="convert-length">Convert</button>
            
            <div class="result" id="length-result"></div>
        </div>
        
        <!-- Weight Conversion -->
        <div id="weight" class="tab-content conversion-card">
            <div class="form-group">
                <label for="weight-value">Value:</label>
                <input type="number" id="weight-value" placeholder="Enter value" step="any">
            </div>
            
            <div class="unit-selectors">
                <div class="form-group">
                    <label for="weight-from">From:</label>
                    <select id="weight-from">
                        <option value="milligram">Milligram (mg)</option>
                        <option value="gram">Gram (g)</option>
                        <option value="kilogram" selected>Kilogram (kg)</option>
                        <option value="ounce">Ounce (oz)</option>
                        <option value="pound">Pound (lb)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="weight-to">To:</label>
                    <select id="weight-to">
                        <option value="milligram">Milligram (mg)</option>
                        <option value="gram">Gram (g)</option>
                        <option value="kilogram">Kilogram (kg)</option>
                        <option value="ounce">Ounce (oz)</option>
                        <option value="pound" selected>Pound (lb)</option>
                    </select>
                </div>
            </div>
            
            <button class="convert-btn" id="convert-weight">Convert</button>
            
            <div class="result" id="weight-result"></div>
        </div>
        
        <!-- Temperature Conversion -->
        <div id="temperature" class="tab-content conversion-card">
            <div class="form-group">
                <label for="temperature-value">Value:</label>
                <input type="number" id="temperature-value" placeholder="Enter value" step="any">
            </div>
            
            <div class="unit-selectors">
                <div class="form-group">
                    <label for="temperature-from">From:</label>
                    <select id="temperature-from">
                        <option value="celsius" selected>Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="temperature-to">To:</label>
                    <select id="temperature-to">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit" selected>Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>
            </div>
            
            <button class="convert-btn" id="convert-temperature">Convert</button>
            
            <div class="result" id="temperature-result"></div>
        </div>
    </div>

    <script>
        /**
         * Unit Converter Application
         * 
         * This application handles conversion between different units of measurement
         * including length, weight, and temperature.
         * 
         * @author Claude
         * @version 1.0
         */

        // Conversion factors relative to base units (meter, gram, kelvin)
        const conversionFactors = {
            // Length (base: meter)
            length: {
                millimeter: 0.001,
                centimeter: 0.01,
                meter: 1,
                kilometer: 1000,
                inch: 0.0254,
                foot: 0.3048,
                yard: 0.9144,
                mile: 1609.344
            },
            // Weight (base: gram)
            weight: {
                milligram: 0.001,
                gram: 1,
                kilogram: 1000,
                ounce: 28.3495,
                pound: 453.592
            }
            // Temperature is handled separately due to non-linear conversions
        };

        /**
         * Converts a value from one unit to another.
         * 
         * @param {number} value - The value to convert
         * @param {string} fromUnit - The source unit
         * @param {string} toUnit - The target unit
         * @param {string} type - The conversion type (length, weight, temperature)
         * @returns {number} The converted value
         */
        function convertValue(value, fromUnit, toUnit, type) {
            // Handle temperature conversions separately (non-linear)
            if (type === 'temperature') {
                return convertTemperature(value, fromUnit, toUnit);
            }
            
            // For linear conversions (length, weight)
            const factors = conversionFactors[type];
            // Convert to base unit first, then to target unit
            const valueInBaseUnit = value * factors[fromUnit];
            return valueInBaseUnit / factors[toUnit];
        }

        /**
         * Converts temperature values between Celsius, Fahrenheit, and Kelvin.
         * 
         * @param {number} value - The temperature value to convert
         * @param {string} fromUnit - The source unit (celsius, fahrenheit, kelvin)
         * @param {string} toUnit - The target unit (celsius, fahrenheit, kelvin)
         * @returns {number} The converted temperature value
         */
        function convertTemperature(value, fromUnit, toUnit) {
            // First convert to Kelvin (base unit for temperature)
            let kelvin;
            
            switch (fromUnit) {
                case 'celsius':
                    kelvin = value + 273.15;
                    break;
                case 'fahrenheit':
                    kelvin = (value + 459.67) * (5/9);
                    break;
                case 'kelvin':
                    kelvin = value;
                    break;
            }
            
            // Then convert from Kelvin to target unit
            switch (toUnit) {
                case 'celsius':
                    return kelvin - 273.15;
                case 'fahrenheit':
                    return kelvin * (9/5) - 459.67;
                case 'kelvin':
                    return kelvin;
            }
        }

        /**
         * Format the converted value with appropriate precision
         * 
         * @param {number} value - The value to format
         * @param {string} type - The conversion type
         * @returns {string} The formatted value
         */
        function formatResult(value, type) {
            // Use appropriate precision based on magnitude and type
            if (Math.abs(value) < 0.01) {
                return value.toExponential(6);
            } else if (type === 'temperature') {
                return value.toFixed(2);
            } else {
                return value.toFixed(6).replace(/\.?0+$/, '');
            }
        }

        /**
         * Set up the conversion event handler for a specific conversion type
         * 
         * @param {string} type - The conversion type (length, weight, temperature)
         */
        function setupConversion(type) {
            const convertBtn = document.getElementById(`convert-${type}`);
            const valueInput = document.getElementById(`${type}-value`);
            const fromSelect = document.getElementById(`${type}-from`);
            const toSelect = document.getElementById(`${type}-to`);
            const resultElement = document.getElementById(`${type}-result`);
            
            convertBtn.addEventListener('click', () => {
                try {
                    // Validate input
                    const value = parseFloat(valueInput.value);
                    if (isNaN(value)) {
                        throw new Error("Please enter a valid number");
                    }
                    
                    const fromUnit = fromSelect.value;
                    const toUnit = toSelect.value;
                    
                    // Perform conversion
                    const result = convertValue(value, fromUnit, toUnit, type);
                    
                    // Display formatted result
                    resultElement.textContent = `${value} ${formatUnitName(fromUnit)} = ${formatResult(result, type)} ${formatUnitName(toUnit)}`;
                    resultElement.style.display = 'block';
                } catch (error) {
                    resultElement.textContent = `Error: ${error.message}`;
                    resultElement.style.display = 'block';
                }
            });
            
            // Handle "Enter" key in input field
            valueInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    convertBtn.click();
                }
            });
        }
        
        /**
         * Format unit name for display in results
         * 
         * @param {string} unit - The unit identifier
         * @returns {string} The formatted unit name
         */
        function formatUnitName(unit) {
            // Map unit identifiers to display names with symbols
            const unitDisplayNames = {
                millimeter: 'mm',
                centimeter: 'cm',
                meter: 'm',
                kilometer: 'km',
                inch: 'in',
                foot: 'ft',
                yard: 'yd',
                mile: 'mi',
                milligram: 'mg',
                gram: 'g',
                kilogram: 'kg',
                ounce: 'oz',
                pound: 'lb',
                celsius: '°C',
                fahrenheit: '°F',
                kelvin: 'K'
            };
            
            return unitDisplayNames[unit] || unit;
        }
        
        /**
         * Set up tabs for switching between conversion types
         */
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Deactivate all tabs and content
                    document.querySelectorAll('.tab, .tab-content').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // Activate selected tab and content
                    tab.classList.add('active');
                    const contentId = tab.getAttribute('data-tab');
                    document.getElementById(contentId).classList.add('active');
                });
            });
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            setupConversion('length');
            setupConversion('weight');
            setupConversion('temperature');
        });
    </script>
</body>
</html>
